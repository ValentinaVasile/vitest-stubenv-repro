name: CI

on:
  pull_request:
    branches:
      - master

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        vitest-version: [3, 4, v5.0.0-beta.4]

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*

      - run: npm install vitest@${{ matrix.vitest-version }}

      - run: node_modules/.bin/vitest run
