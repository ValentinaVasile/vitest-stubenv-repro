name: Build

on:
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        vitestVersion: [3, 4, 5]

    steps:
    - uses: actions/checkout@v6

    - name: Use Node.js
      uses: actions/setup-node@v6
      with:
        node-version: lts/*

    - run: npm install

    - run: npx run vitest@${{ matrix.vitestVersion }}
